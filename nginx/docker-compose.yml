services:
  proxy:
    image: nexus.jbrmmg.me.uk:8084/proxy:latest
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - MONEY_BACKEND=${MONEY_BACKEND}
      - BACKUP_BACKEND=${BACKUP_BACKEND}
      - HOME_API_BACKEND=${HOME_API_BACKEND}
    networks:
      - jbr-network

networks:
  jbr-network:
    external: true
