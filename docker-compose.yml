services:
  webpage:
    image: nexus.jbrmmg.me.uk:8084/webpage:latest
    container_name: webpage
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKUP_BACKEND=${BACKUP_BACKEND}
      - MONEY_BACKEND=${MONEY_BACKEND}
    networks:
      - jbr-network

networks:
  jbr-network:
    external: true
