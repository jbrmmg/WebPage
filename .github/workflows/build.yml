name: Build and Deploy

on:
  push:
    branches:
      - Release

jobs:
  build:
    runs-on: webpage-prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Maven and Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q maven
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -q ./google-chrome-stable_current_amd64.deb
          echo "CHROME_BIN=$(which google-chrome-stable)" >> $GITHUB_ENV

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>Snapshots</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>Releases</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>main</id>
                <username>deployment</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>main</id>
                <mirrorOf>central</mirrorOf>
                <url>http://nexus.jbrmmg.me.uk:8081/repository/maven-public/</url>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>default</id>
                <properties>
                  <repository.url>http://nexus.jbrmmg.me.uk:8081/repository</repository.url>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Compute version
        run: echo "VERSION=$(date +'%Y.%m').${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build and Test with Maven
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mvn verify -Drevision=${{ env.VERSION }}

      - name: Run Sonar
        run: mvn sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Drevision=${{ env.VERSION }}

      - name: Build Docker images
        run: |
          docker build \
            -f src/deployment/Dockerfile \
            -t nexus.jbrmmg.me.uk:8083/webpage:${{ github.sha }} \
            -t nexus.jbrmmg.me.uk:8083/webpage:latest \
            .
          docker build \
            -f nginx/Dockerfile \
            -t nexus.jbrmmg.me.uk:8083/proxy:${{ github.sha }} \
            -t nexus.jbrmmg.me.uk:8083/proxy:latest \
            nginx/

      - name: Push to Nexus Docker registry
        run: |
          docker login nexus.jbrmmg.me.uk:8083 \
            -u deployment \
            -p ${{ secrets.NEXUS_PASSWORD }}
          docker push nexus.jbrmmg.me.uk:8083/webpage:${{ github.sha }}
          docker push nexus.jbrmmg.me.uk:8083/webpage:latest
          docker push nexus.jbrmmg.me.uk:8083/proxy:${{ github.sha }}
          docker push nexus.jbrmmg.me.uk:8083/proxy:latest

      - name: Deploy
        env:
          PDN_WEBPAGE_MONEY_BACKEND: ${{ secrets.PDN_WEBPAGE_MONEY_BACKEND }}
          PDN_WEBPAGE_BACKUP_BACKEND: ${{ secrets.PDN_WEBPAGE_BACKUP_BACKEND }}
          PDN_WEBPAGE_HOME_API_BACKEND: ${{ secrets.PDN_WEBPAGE_HOME_API_BACKEND }}
        run: |
          docker network create jbr-network 2>/dev/null || true
          docker login nexus.jbrmmg.me.uk:8084 \
            -u deployment \
            -p ${{ secrets.NEXUS_PASSWORD }}
          echo "BACKUP_BACKEND=${PDN_WEBPAGE_BACKUP_BACKEND}" > .env
          echo "MONEY_BACKEND=${PDN_WEBPAGE_MONEY_BACKEND}" >> .env
          echo "HOME_API_BACKEND=${PDN_WEBPAGE_HOME_API_BACKEND}" >> .env
          docker compose -f nginx/docker-compose.yml --env-file .env pull
          docker compose -f nginx/docker-compose.yml --env-file .env up -d
          docker compose pull
          docker compose up -d
