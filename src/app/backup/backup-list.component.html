<nav class="tab-bar">
    <button class="tab-btn"
            [class.active]="isSummaryMode"
            (click)="selectSummaryMode()"
            title="Summary">
        <em class="fa fa-hdd-o"></em>
        <span class="tab-label">Summary</span>
    </button>
    <button class="tab-btn"
            [class.active]="isClassificationsMode"
            (click)="selectClassificationsMode()"
            title="Classifications">
        <em class="fa fa-tags"></em>
        <span class="tab-label">Classifications</span>
    </button>
    <button class="tab-btn"
            [class.active]="isHardwareMode"
            (click)="selectHardwareMode()"
            title="Hardware">
        <em class="fa fa-sitemap"></em>
        <span class="tab-label">Hardware</span>
    </button>
    <button class="tab-btn"
            [class.active]="isFileMode"
            (click)="selectFileMode()"
            title="Files">
        <em class="fa fa-folder-open"></em>
        <span class="tab-label">Files</span>
    </button>
    <button class="tab-btn"
            [class.active]="isActionMode"
            (click)="selectActionMode()"
            title="Actions">
        <em class="fa fa-exclamation-circle"></em>
        <span class="tab-label">Actions</span>
        <span class="tab-badge" *ngIf="actionCount > 0">{{actionCount}}</span>
    </button>
    <button class="tab-btn"
            [class.active]="isImportMode"
            (click)="selectImportMode()"
            title="Import">
        <em class="fa fa-level-down"></em>
        <span class="tab-label">Import</span>
    </button>
    <button class="tab-btn"
            [class.active]="isPrintsMode"
            (click)="selectPrintsMode()"
            title="Prints">
        <em class="fa fa-print"></em>
        <span class="tab-label">Prints</span>
    </button>
    <button class="tab-btn"
            [class.active]="isJobsMode"
            (click)="selectJobsMode()"
            title="Backup Jobs">
        <em class="fa fa-tasks"></em>
        <span class="tab-label">Backups</span>
    </button>
    <button class="tab-btn"
            [class.active]="isSearchMode"
            (click)="selectSearchMode()"
            title="Search">
        <em class="fa fa-search"></em>
        <span class="tab-label">Search</span>
    </button>
</nav>
<div class="tab-content">
    <div id="summary" [collapse]="!isSummaryMode">
        <jbr-backup-summary></jbr-backup-summary>
    </div>
    <div id="files" [collapse]="!isFileMode">
        <jbr-backup-display (selectPhoto)="selectPhotoMode()"></jbr-backup-display>
    </div>
    <div id="actions" [collapse]="!isActionMode">
        <jbr-backup-action></jbr-backup-action>
    </div>
    <div id="import" [collapse]="!isImportMode">
        <jbr-import-grid></jbr-import-grid>
    </div>
    <div id="photo" [collapse]="!isPhotoMode">
        <jbr-backup-photo (exit)="selectFileMode()"></jbr-backup-photo>
    </div>
    <div id="prints" [collapse]="!isPrintsMode">
        <jbr-backup-prints></jbr-backup-prints>
    </div>
    <div id="jobs" [collapse]="!isJobsMode">
        <jbr-backup-jobs></jbr-backup-jobs>
    </div>
    <div id="search" [collapse]="!isSearchMode">
        <jbr-backup-search></jbr-backup-search>
    </div>
    <div id="classifications" [collapse]="!isClassificationsMode">
        <jbr-backup-classifications></jbr-backup-classifications>
    </div>
    <div id="hardware" [collapse]="!isHardwareMode">
        <jbr-backup-hardware></jbr-backup-hardware>
    </div>
</div>
