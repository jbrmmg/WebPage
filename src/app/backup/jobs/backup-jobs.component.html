<div class="jobs-container">
    <div class="day-tabs" *ngIf="days.length > 1">
        <button class="day-tab"
                *ngFor="let day of days"
                [class.active]="day === selectedDay"
                (click)="selectDay(day)">
            {{ formatDayTab(day) }}
        </button>
    </div>

    <div class="jobs-scroll">
        <table class="jobs-table">
            <thead>
                <tr>
                    <th class="col-id">Backup ID</th>
                    <th class="col-time">Start Time</th>
                    <th class="col-time">Finish Time</th>
                    <th class="col-status">Status</th>
                    <th class="col-message">Message</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let job of jobsForDay" [ngClass]="getStatusClass(job.status)">
                    <td class="col-id id-cell">{{ job.backupId }}</td>
                    <td class="col-time">{{ formatTime(job.startedAt) }}</td>
                    <td class="col-time">{{ formatTime(job.finishedAt) }}</td>
                    <td class="col-status">
                        <span class="status-badge" [ngClass]="getStatusClass(job.status)">
                            <em [ngClass]="getStatusIcon(job.status)"></em>
                            {{ job.status }}
                        </span>
                    </td>
                    <td class="col-message">{{ job.message }}</td>
                </tr>
            </tbody>
        </table>
        <div class="no-jobs" *ngIf="jobsForDay.length === 0">
            No jobs recorded for this day.
        </div>
    </div>
</div>
