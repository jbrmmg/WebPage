<div class="search-container">
    <div class="criteria-section">
        <div class="criteria-grid">
            <div class="criteria-group">
                <label class="criteria-label">Filename</label>
                <input type="text" class="form-control input-sm" [(ngModel)]="filename"
                       placeholder="e.g. fred*.jpg" />
            </div>
            <div class="criteria-group">
                <label class="criteria-label">Date From</label>
                <input type="text" class="form-control input-sm"
                       [bsValue]="dateFrom" (bsValueChange)="dateFrom = $event"
                       placeholder="Date from"
                       bsDatepicker [bsConfig]="datePickerConfig" />
            </div>
            <div class="criteria-group">
                <label class="criteria-label">Date To</label>
                <input type="text" class="form-control input-sm"
                       [bsValue]="dateTo" (bsValueChange)="dateTo = $event"
                       placeholder="Date to"
                       bsDatepicker [bsConfig]="datePickerConfig" />
            </div>
            <div class="criteria-group">
                <label class="criteria-label">Min Size (bytes)</label>
                <input type="number" class="form-control input-sm" [(ngModel)]="sizeMin"
                       placeholder="Min size" />
            </div>
            <div class="criteria-group">
                <label class="criteria-label">Max Size (bytes)</label>
                <input type="number" class="form-control input-sm" [(ngModel)]="sizeMax"
                       placeholder="Max size" />
            </div>
            <div class="criteria-group">
                <label class="criteria-label">Expiry From</label>
                <input type="text" class="form-control input-sm"
                       [bsValue]="expiryFrom" (bsValueChange)="expiryFrom = $event"
                       placeholder="Expiry from"
                       bsDatepicker [bsConfig]="datePickerConfig" />
            </div>
            <div class="criteria-group">
                <label class="criteria-label">Expiry To</label>
                <input type="text" class="form-control input-sm"
                       [bsValue]="expiryTo" (bsValueChange)="expiryTo = $event"
                       placeholder="Expiry to"
                       bsDatepicker [bsConfig]="datePickerConfig" />
            </div>
        </div>

        <div class="labels-row" *ngIf="availableLabels.length > 0">
            <label class="criteria-label">Labels</label>
            <div class="label-chips">
                <span *ngFor="let label of availableLabels"
                      class="label-chip"
                      [class.label-chip-active]="isLabelSelected(label)"
                      (click)="toggleSearchLabel(label)"
                      [title]="isLabelSelected(label) ? 'Remove from filter' : 'Add to filter'">
                    {{label.name}}
                </span>
            </div>
        </div>

        <div class="location-row">
            <label class="criteria-label location-toggle">
                <input type="checkbox" [(ngModel)]="useLocation" />
                Search by location &mdash; pan/zoom map to set bounds
            </label>
            <div *ngIf="useLocation">
                <jbr-map [width]="450" [height]="380"
                         (boundsChange)="onBoundsChange($event)"></jbr-map>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-sm btn-primary" (click)="search()" [disabled]="!hasAnyCriteria || loading">
                <em class="fa fa-search"></em> Search
            </button>
            <button class="btn btn-sm btn-secondary" (click)="clear()" [disabled]="!hasAnyCriteria && !searched">
                <em class="fa fa-times"></em> Clear
            </button>
            <ng-container *ngIf="searched && totalCount > 0">
                <button class="btn btn-sm btn-secondary" (click)="prevPage()" [disabled]="!canPrev">
                    <em class="fa fa-chevron-left"></em>
                </button>
                <span class="page-info">Page {{page + 1}} of {{totalPages}} &mdash; {{totalCount}} results</span>
                <button class="btn btn-sm btn-secondary" (click)="nextPage()" [disabled]="!canNext">
                    <em class="fa fa-chevron-right"></em>
                </button>
                <select class="form-control input-sm page-size-select"
                        [(ngModel)]="pageSize" (ngModelChange)="onPageSizeChange()">
                    <option *ngFor="let s of pageSizes" [value]="s">{{s}} per page</option>
                </select>
            </ng-container>
        </div>
    </div>

    <div class="results-section" *ngIf="searched">
        <div class="no-results" *ngIf="!loading && results.length === 0">No results found.</div>
        <table class="results-table" *ngIf="results.length > 0">
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Path</th>
                    <th>Date</th>
                    <th>Size</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let r of results">
                    <td class="col-name">
                        <em class="fa"
                            [class.fa-file-image-o]="r.image"
                            [class.fa-file-video-o]="!r.image && r.video"
                            [class.fa-file-o]="!r.image && !r.video"></em>
                        {{r.name}}
                    </td>
                    <td class="col-path">{{r.path}}</td>
                    <td class="col-date">{{formatDate(r.date)}}</td>
                    <td class="col-size">{{formatSize(r.size)}}</td>
                    <td class="col-location">{{r.locationName}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
