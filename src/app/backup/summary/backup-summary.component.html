<div class="summary-header-row">
    <p class="summary-header">Backup Summary Information</p>
    <button class="btn-refresh" (click)="refresh()" title="Refresh summary data">
        <em class="fa fa-refresh"></em>
    </button>
</div>
<p class="summary-date" *ngIf="summary.valid">{{formattedDate}}</p>
<p class="summary-date" *ngIf="!summary.valid">Summary not available</p>
<jbr-summary-grid [summary]="summary"></jbr-summary-grid>
