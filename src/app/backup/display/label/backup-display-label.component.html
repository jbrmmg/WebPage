<div class="label-row" *ngIf="allLabels.length > 0">
    <span *ngFor="let label of allLabels"
          class="label-chip"
          [class.label-chip-active]="isAssigned(label)"
          (click)="toggle(label)"
          (keydown.enter)="toggle(label)"
          [title]="isAssigned(label) ? 'Remove label' : 'Add label'"
          tabindex="0">
        {{label.name}}
    </span>
</div>
