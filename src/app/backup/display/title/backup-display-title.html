<ng-container *ngIf="selectedFile != null">
    <div class="row name-row">
        <em class="fa {{selectedFile.file.icon}} detail-name-icon"></em>
        <p id="selected-file-id" class="detail-name">{{selectedFile.file.name}}</p>
    </div>
    <div class="row">
        <div class="btn-row-left btn-previous">
            <button class="btn btn-sm btn-primary" (click)="previous()" title="Goto the previous file.">
                <em class="fa fa-chevron-circle-left"></em>
            </button>
        </div>
        <div class="btn-row-left btn-next">
            <button class="btn btn-sm btn-primary" (click)="next()" title="Goto the next file.">
                <em class="fa fa-chevron-circle-right"></em>
            </button>
        </div>
        <div class="btn-row-left btn-print">
            <button class="btn btn-sm btn-primary" (click)="print()" title="Select the image for printing.">
                <em class="fa fa-print"></em>
            </button>
        </div>
        <div class="btn-row-left btn-refresh">
            <button class="btn btn-sm btn-primary" (click)="refreshData()" title="Refresh the details stored for the file.">
                <em class="fa fa-recycle"></em>
            </button>
        </div>
        <div class="btn-row-left btn-zoom-out" *ngIf="displayZoom()">
            <button class="btn btn-sm btn-primary" (click)="zoomOut()" title="Zoom out">
                <em class="fa fa-minus"></em>
            </button>
        </div>
        <div class="btn-row-left btn-zoom-in" *ngIf="displayZoom()">
            <button class="btn btn-sm btn-primary" (click)="zoomIn()" title="Zoom in">
                <em class="fa fa-plus"></em>
            </button>
        </div>
        <div class="btn-row-right">
            <button class="btn btn-sm btn-danger align-right" (click)="delete()" title="Delete the file.">
                <em class="fa fa-trash"></em>
            </button>
        </div>
    </div>
</ng-container>
