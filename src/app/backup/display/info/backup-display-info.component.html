<div class="row">
    <div class="col-12 no-padding-col">
        <div class="row detail-full-name-row">
            <p class="detail-full-name">{{selectedFile.file.fullFilename}}</p>
        </div>
        <div class="row detail-size-row">
            <p class="detail-size-label col-2">Size</p>
            <p class="detail-size col-10">{{selectedFile.file.size | number}}</p>
        </div>
        <div class="row detail-date-row">
            <p class="detail-date-label col-2">File date</p>
            <p class="detail-date col-10">{{formattedFileDate}}</p>
        </div>
        <div class="row detail-md5-row">
            <p class="detail-md5-label col-2">MD5</p>
            <p class="detail-md5 col-10">[{{selectedFile.file.md5}}]</p>
        </div>
        <div class="row detail-expiry-row">
            <em class="fa fa-calendar detail-calendar-icon" title="Modify expiry date" (click)="editDate()" (keydown.enter)="editDate()" tabindex="0"></em>
            <em class="fa fa-times detail-expiry-clear-icon" (click)="clearExpiry()" (keydown.enter)="clearExpiry()" tabindex="0" *ngIf="selectedFile.file.expiry != null && editDateEnable == false"></em>
            <p class="detail-expiry" *ngIf="selectedFile.file.expiry != null && editDateEnable == false">Expiry: {{formattedExpiryDate}}</p>
            <p class="detail-expiry" *ngIf="selectedFile.file.expiry == null && editDateEnable == false">File does not expire</p>
            <input *ngIf="editDateEnable == true"
                   id="expiry-date"
                   type="text"
                   [bsValue]="internalExpiryDate"
                   (bsValueChange)="onChangeExpiry($event)"
                   placeholder="Expiry Date"
                   class="form-control expiry-datepicker"
                   bsDatepicker [bsConfig]="{
                        dateInputFormat: 'DD-MMMM-YYYY',
                        containerClass: 'theme-dark-blue',
                        selectFromOtherMonth: true }"/>
        </div>
    </div>
</div>
