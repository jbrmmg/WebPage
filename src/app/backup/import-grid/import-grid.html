<import-selected #selected (actionEvent)="action($event,confirmTemplate)"></import-selected>
<jbr-import-grid-status [status]="status"
    [limit]="limit"
    (refreshEvent)="refresh()"
    (limitChangeEvent)="changeLimit($event)"
    (removeIgnoredEvent)="removeIgnored()"
    (importFilesEvent)="importFiles()"
    (removeDuplicateEvent)="removeDuplicates()"
    (processEvent)="process()"></jbr-import-grid-status>
<div class="row file-table">
    <table>
        <thead>
            <tr>
                <th>
                    <jbr-import-grid-header-expand></jbr-import-grid-header-expand>
                </th>
                <th>
                    <jbr-import-grid-header-name (fireSource)="sortData($event,true)"></jbr-import-grid-header-name>
                </th>
                <th>
                    <jbr-import-grid-header-md5 (fireSource)="sortData($event,true)"></jbr-import-grid-header-md5>
                </th>
                <th>
                    <jbr-import-grid-header-size (fireSource)="sortData($event,true)"></jbr-import-grid-header-size>
                </th>
                <th>
                    <jbr-import-grid-header-date (fireSource)="sortData($event,true)"></jbr-import-grid-header-date>
                </th>
                <th>
                    <jbr-import-grid-header-traffic (fireSource)="sortData($event,true)" (filterChange)="filterStatus($event)" [type]="TrafficLightType.ImmediateImportStatus"></jbr-import-grid-header-traffic>
                </th>
                <th>
                    <jbr-import-grid-header-traffic (fireSource)="sortData($event,true)" (filterChange)="filterStatus($event)" [type]="TrafficLightType.IgnoreStatus"></jbr-import-grid-header-traffic>
                </th>
                <th>
                    <jbr-import-grid-header-traffic (fireSource)="sortData($event,true)" (filterChange)="filterStatus($event)" [type]="TrafficLightType.ImportStatus"></jbr-import-grid-header-traffic>
                </th>
                <th>
                    <jbr-import-grid-header-traffic (fireSource)="sortData($event,true)" (filterChange)="filterStatus($event)" [type]="TrafficLightType.DuplicateStatus"></jbr-import-grid-header-traffic>
                </th>
                <th>
                    <jbr-import-grid-header-destination></jbr-import-grid-header-destination>
                </th>
            </tr>
        </thead>
        <tbody *ngIf="data && data.length">
            <tr *ngFor="let file of data">
                <ng-container *ngIf="file.visible">
                    <td>
                        <jbr-import-grid-data-select [file]=file (select)="selectRequest($event)"></jbr-import-grid-data-select>
                    </td>
                    <td>
                        <jbr-import-grid-data-name [file]=file></jbr-import-grid-data-name>
                    </td>
                    <td>
                        <jbr-import-grid-data-md5 [file]=file></jbr-import-grid-data-md5>
                    </td>
                    <td>
                        <jbr-import-grid-data-size [file]=file></jbr-import-grid-data-size>
                    </td>
                    <td>
                        <jbr-import-grid-data-date [file]=file></jbr-import-grid-data-date>
                    </td>
                    <td>
                        <jbr-import-grid-data-traffic [file]=file [type]="TrafficLightType.ImmediateImportStatus"></jbr-import-grid-data-traffic>
                    </td>
                    <td>
                        <jbr-import-grid-data-traffic [file]=file [type]="TrafficLightType.IgnoreStatus"></jbr-import-grid-data-traffic>
                    </td>
                    <td>
                        <jbr-import-grid-data-traffic [file]=file [type]="TrafficLightType.ImportStatus"></jbr-import-grid-data-traffic>
                    </td>
                    <td>
                        <jbr-import-grid-data-traffic [file]=file [type]="TrafficLightType.DuplicateStatus"></jbr-import-grid-data-traffic>
                    </td>
                    <td>
                        <jbr-import-grid-data-destination [file]="file"></jbr-import-grid-data-destination>
                    </td>
                </ng-container>
            </tr>
        </tbody>
    </table>
</div>

<ng-template #confirmTemplate>
    <div class="modal-body text-center">
        <p>Are you sure you want to delete?</p>
        <button type="button" class="btn btn-default" (click)="deleteConfirmed()" >Yes</button>
        <button type="button" class="btn btn-primary" (click)="deleteRejected()" >No</button>
    </div>
</ng-template>
