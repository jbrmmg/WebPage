<div class="row file-table">
    <div class="row file-table header-row">
        <div class="no-pad col refresh">
            <label class="btn btn-primary btn-mode"
                   tabindex="1"
                   aria-controls="list"
                   (click)="refresh()">
                <em class="fa fa-refresh"></em>
            </label>
        </div>
        <div class="no-pad col status">{{status}}</div>
    </div>
    <table>
        <thead>
            <tr>
                <th>
                    <jbr-import-grid-header-expand></jbr-import-grid-header-expand>
                </th>
                <th>
                    <jbr-import-grid-header-name (fireSource)="sortData($event,true)"></jbr-import-grid-header-name>
                </th>
                <th>
                    <jbr-import-grid-header-md5 (fireSource)="sortData($event,true)"></jbr-import-grid-header-md5>
                </th>
                <th>
                    <jbr-import-grid-header-size (fireSource)="sortData($event,true)"></jbr-import-grid-header-size>
                </th>
                <th>
                    <jbr-import-grid-header-date (fireSource)="sortData($event,true)"></jbr-import-grid-header-date>
                </th>
                <th>
                    <jbr-import-grid-header-status (fireSource)="sortData($event,true)"></jbr-import-grid-header-status>
                </th>
            </tr>
        </thead>
        <tbody *ngIf="data && data.length">
            <tr *ngFor="let file of data">
                <ng-container *ngIf="file.visible">
                    <td>
                        <jbr-import-grid-data-expand [file]=file (fireExpand)="expandRequest($event)"></jbr-import-grid-data-expand>
                    </td>
                    <td>
                        <jbr-import-grid-data-name [file]=file></jbr-import-grid-data-name>
                    </td>
                    <td>
                        <jbr-import-grid-data-md5 [file]=file></jbr-import-grid-data-md5>
                    </td>
                    <td>
                        <jbr-import-grid-data-size [file]=file></jbr-import-grid-data-size>
                    </td>
                    <td>
                        <jbr-import-grid-data-date [file]=file></jbr-import-grid-data-date>
                    </td>
                    <td>
                        <jbr-import-grid-data-status [file]=file (delete)="deleteFile($event)"></jbr-import-grid-data-status>
                    </td>
                </ng-container>
            </tr>
        </tbody>
    </table>
</div>
