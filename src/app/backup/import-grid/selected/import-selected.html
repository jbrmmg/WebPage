<div class="row">
    <div class="col selected-col">
        <import-selected-image #image></import-selected-image>
    </div>
    <div class="col selected-col">
        <import-selected-map #map></import-selected-map>
    </div>
    <div class="col selected-col-end">
        <import-selected-data #data
            (previousEvent)="previous($event)"
            (nextEvent)="next($event)"
            (deleteEvent)="delete($event)">
        </import-selected-data>
    </div>
</div>
