<div>
    <div class="row">
        <div class="col-1 title">Filename</div>
        <div class="col-10 data">{{getText()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">Latitude</div>
        <div class="col-10 data">{{getLat()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">Longitude</div>
        <div class="col-10 data">{{getLong()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">Image Width</div>
        <div class="col-10 data">{{getImageWidth()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">Image Height</div>
        <div class="col-10 data">{{getImageHeight()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">File Date</div>
        <div class="col-10 data">{{getFileDate()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">File Size</div>
        <div class="col-10 data">{{getFileSize()}}</div>
    </div>
    <div class="row">
        <div class="col-1 title">MD5</div>
        <div class="col-10 data">{{getMD5()}}</div>
    </div>
    <div class="row">
        <div class="col action-btn-first">
            <label class="btn btn-primary"
                   aria-controls="list"
                   (click)="previous()">
                <em class="fa fa-arrow-left"></em>
            </label>
        </div>
        <div class="col action-btn">
            <label class="btn btn-primary"
                   title="Move to the next photo"
                   (click)="next()">
                <em class="fa fa-arrow-right"></em>
            </label>
        </div>
        <div class="col action-btn">
            <label class="btn btn-danger"
                   title="Move to the previous photo"
                   (click)="delete()">
                <em class="fa fa-trash"></em>
            </label>
        </div>
        <div class="col action-btn">
            <label class="btn btn-outline-danger"
                   title="Mark this photo to be ignored."
                   (click)="ignore()">
                <em class="fa fa-minus-circle"></em>
            </label>
        </div>
        <div class="col action-btn">
            <label class="btn btn-outline-success"
                   title="Import this photo as a recipe"
                   (click)="recipe()">
                <em class="fa fa-cutlery"></em>
            </label>
        </div>
        <div class="col action-btn">
            <label class="btn btn-outline-success"
                   title="Import this file into the photo directory, you must provide name of sub-directory."
                   (click)="import()">
                <em class="fa fa-arrow-right"></em>
            </label>
        </div>
        <div class="col directory-frame">
            <input class="directory" type="text">
        </div>
    </div>
    <div class="row">
        <import-selected-data-similar [date]="date" [size]="size" [md5]="md5" [similar]="similar"></import-selected-data-similar>
    </div>
</div>
