<div>
    <div class="row">
        <div class="col-2 title">Filename</div>
        <div class="col-4 data">{{getText()}}</div>
        <div class="col-4 data">{{getImportName()}}</div>
    </div>
    <div class="row">
        <div class="col-2 title">Location</div>
        <div class="col-4 data">{{getLatLong()}}</div>
    </div>
    <div class="row">
        <div class="col-2 title">Image Size</div>
        <div class="col-4 data">{{getImageSize()}}</div>
    </div>
    <div class="row">
        <div class="col-2 title">File Date</div>
        <div class="col-4 data">{{getFileDate()}}</div>
        <div class="col-4 data">{{getImportDate()}}</div>
    </div>
    <div class="row">
        <div class="col-2 title">File Size</div>
        <div class="col-4 data">{{getFileSize()}}</div>
        <div class="col-4 data">{{getImportSize()}}</div>
    </div>
    <div class="row">
        <div class="col-2 title">MD5</div>
        <div class="col-4 data md5">{{getMD5()}}</div>
        <div class="col-4 data md5">{{getImportMd5()}}</div>
    </div>
    <div class="row">
        <div class="col-2 title">Status</div>
        <div class="col-8 data">
            <table>
                <thead>
                    <tr>
                        <ng-container *ngFor="let step of getSteps()">
                            <th>{{step}}</th>
                        </ng-container>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <ng-container *ngFor="let step of getSteps()">
                            <td [class]="getStatusClass(step)">{{getStatusText(step)}}</td>
                        </ng-container>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="row btn-row">
        <div class="col action-btn-first">
            <button class="btn btn-primary"
                   title="Move to the previous file in the list."
                   (click)="previous()">
                <em class="fa fa-arrow-left"></em>
            </button>
        </div>
        <div class="col action-btn">
            <button class="btn btn-primary"
                   title="Move to the next file in the list."
                   (click)="next()">
                <em class="fa fa-arrow-right"></em>
            </button>
        </div>
        <div class="col action-btn">
            <button class="btn btn-danger"
                   title="Remove this file from the import."
                   (click)="delete()">
                <em class="fa fa-trash"></em>
            </button>
        </div>
        <div class="col action-btn">
            <button [class]="getIgnoreButtonLabelClass()"
                   [title]="getIgnoreButtonTitle()"
                   (click)="ignore()">
                <em [class]="getIgnoreButtonClass()"></em>
            </button>
        </div>
        <div class="col action-btn">
            <button class="btn btn-outline-success"
                   title="Import this photo as a recipe"
                   (click)="recipe()">
                <em class="fa fa-cutlery"></em>
            </button>
        </div>
        <div class="col action-btn">
            <button class="btn btn-outline-primary"
                   title="Import this photo as a basic backup"
                   (click)="backup()">
                <em class="fa fa-recycle"></em>
            </button>
        </div>
        <input class="col directory" type="text" size="40" [(ngModel)]="destination" (keydown.enter)="enterDestination()">
    </div>
    <div class="row">
        <import-selected-data-similar
                [name]="filename"
                [date]="date"
                [size]="size"
                [md5]="md5"
                [importName]="importFilename"
                [importDate]="importDate"
                [importSize]="importSize"
                [importMd5]="importMd5"
                [similar]="similar"></import-selected-data-similar>
    </div>
</div>
