<div class="image-container">
    <div class="image-frame">
        <ng-container *ngIf="noSelection">
            <div class="no-selection">
                <svg class="no-selection-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M9 5l1.5-2h3L15 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="no-selection-label">No photo selected</span>
            </div>
        </ng-container>
        <ng-container *ngIf="showImage()">
            <img src="{{getImagePath()}}" alt="{{getText()}}" title="{{getText()}}">
        </ng-container>
        <ng-container *ngIf="showVideo()">
            <video src="{{getVideoPath()}}" title="{{getText()}}" width="316" height="237" controls>
                <track kind="captions" src="" label="Captions">
            </video>
        </ng-container>
    </div>
</div>
