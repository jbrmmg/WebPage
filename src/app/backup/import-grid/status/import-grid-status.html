<div class="row status-table">
    <div class="no-pad col limit-left">
        <label class="btn btn-info btn-arrow" (click)="decrease(10)">
            <em class="fa fa-long-arrow-down btn-icon"></em>
        </label>
    </div>
    <div class="no-pad col limit-left">
        <label class="btn btn-info btn-arrow" (click)="decrease(1)">
            <em class="fa fa-arrow-down btn-icon"></em>
        </label>
    </div>
    <div class="no-pad col limit-value" title="Limit the number of import photo's, zero means no limit">
        <label class="btn btn-info btn-limit">{{getLimit()}}</label>
    </div>
    <div class="no-pad col limit-left">
        <label class="btn btn-info btn-arrow" (click)="increase(1)">
            <em class="fa fa-arrow-up btn-icon"></em>
        </label>
    </div>
    <div class="no-pad col limit-right">
        <label class="btn btn-info btn-arrow" (click)="increase(10)">
            <em class="fa fa-long-arrow-up btn-icon"></em>
        </label>
    </div>
    <div class="no-pad col global-action" title="Remove any files that are already marked as ignore.">
        <label class="btn btn-outline-warning"
               aria-controls="list"
               (click)="removeIgnored()">
            <em class="fa fa-minus-circle"></em>
        </label>
    </div>
    <div class="no-pad col global-action" title="Import the files">
        <label class="btn btn-outline-warning"
               (click)="importFiles()">
            <em class="fa fa-arrow-right"></em>
        </label>
    </div>
    <div class="no-pad col global-action" title="Remove any files that are definitely already present.">
        <label class="btn btn-outline-warning"
               (click)="removeDuplicates()">
            <em class="fa fa-trash"></em>
        </label>
    </div>
    <div class="no-pad col process-action" title="Process the files listed below and remove the files">
        <label class="btn btn-outline-success"
               (click)="process()">
            <em class="fa fa-arrow-right"></em>
        </label>
    </div>
    <div class="no-pad col refresh" title="Refresh the list of files displayed here.">
        <label class="btn btn-primary"
               (click)="refresh()">
            <em class="fa fa-refresh"></em>
        </label>
    </div>
    <div class="col status">{{status}}</div>
</div>
