<div class="row status-table">
    <div class="no-pad col limit-left">
        <label class="btn btn-info btn-arrow" (click)="decrease()">
            <em class="fa fa-arrow-left btn-icon"></em>
        </label>
    </div>
    <div class="no-pad col limit-value" title="Limit the number of import photo's, zero means no limit">
        <label class="btn btn-info btn-limit">{{getLimit()}}</label>
    </div>
    <div class="no-pad col limit-right">
        <label class="btn btn-info btn-arrow" (click)="increase()">
            <em class="fa fa-arrow-right btn-icon"></em>
        </label>
    </div>
    <div class="no-pad col refresh">
        <label class="btn btn-primary"
               aria-controls="list"
               (click)="refresh()">
            <em class="fa fa-refresh"></em>
        </label>
    </div>
    <div class="col status">{{status}}</div>
</div>
