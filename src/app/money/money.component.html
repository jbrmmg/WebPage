<div class="card">
    <div class="card-body">
        <jbr-money-toolbar [status]="status" [version]="version" [hasChanges]="hasChanges" (filterClick)="showFilter=true" (saveClick)="onSave()"></jbr-money-toolbar>
        <jbr-grid-transaction style="width: 100%" [filter]="filter" (statusChange)="status = $event" (versionChange)="version = $event" (hasChanges)="hasChanges=$event"></jbr-grid-transaction>
    </div>
</div>

<jbr-money-filter *ngIf="showFilter" [filter]="filter" (filterApplied)="onFilterApplied($event)" (filterClosed)="showFilter=false"></jbr-money-filter>
