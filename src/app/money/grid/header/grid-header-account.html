<div (click)="openModal(templateAccount)">
    <p>{{header}}</p>
</div>

<ng-template #templateAccount>
    <div class="modal-header">
        <h4 class="modal-title pull-left title">Select Accounts (or all)</h4>
    </div>
    <div class="body">
        <div class="row account-row" *ngFor="let nextAccount of accounts">
            <div class="col-1 remove-padding col-centre" (click)="changed(nextAccount.id)">
                <input type="checkbox" [checked]="getChecked(nextAccount.id)"/>
            </div>
            <div class="col-1 remove-padding">
                <img class="account-img" src="{{getAccountImage(nextAccount.id)}}" alt="Account"/>
            </div>
            <div class="col-10 remove-padding">
                <p class="name">{{nextAccount.display}}</p>
            </div>
        </div>
        <div class="row remove-margin">
            <div class="col-2 remove-padding">
                <div class="btn-exit-div">
                    <label class="btn-exit btn btn-primary" (click)="selectAll()">All</label>
                </div>
            </div>
            <div class="col-6 remove-padding"></div>
            <div class="col-2 remove-padding">
                <div class="btn-exit-div">
                    <label class="btn-exit btn btn-primary" (click)="exit()">Exit</label>
                </div>
            </div>
            <div class="col-2 remove-padding">
                <div class="btn-ok-div">
                    <label class="btn-ok btn btn-primary" (click)="selectAccounts()">OK</label>
                </div>
            </div>
        </div>
    </div>
</ng-template>
