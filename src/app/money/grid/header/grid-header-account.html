<div (click)="openModal(templateAccount)">
    <p>{{header}}</p>
</div>

<ng-template #templateAccount>
    <div class="modal-header">
        <h4 class="modal-title pull-left title">Select Accounts (or all)</h4>
    </div>
    <div class="body">
        <jbr-account style="width:100%"
                     [filterMode]="true"
                     [allowClosed]="true"
                     [selectedAccountIds]="accountIds"
                     (cleared)="onClear()"
                     (selected)="onSelect($event)"
                     (exit)="onExit()"></jbr-account>
    </div>
</ng-template>
