<p (click)="openModal(templateDateFilter)">{{header}}</p>

<ng-template #templateDateFilter>
    <jbr-popup [title]="'Select Date Range'"
               [imageUrl]="'../../../../assets/images/money/default-popup.svg'"
               [content]="content" [inputs]="inputs"
               [ok]="true"
               [exit]="true"
               [clear]="true"
               (okEvent)="onOK()"
               (clearEvent)="onClear()"
               (exitEvent)="onExit()">
    </jbr-popup>
</ng-template>
