<p (click)="openModal(templateFlagFilter)" (keydown.enter)="openModal(templateFlagFilter)" tabindex="0">{{header}}</p>
<input type="checkbox" [indeterminate]="unset()" [checked]="flagFilter()" (change)="changeValue()">

<ng-template #templateFlagFilter>
    <jbr-popup [title]="'Select Flags'"
               [subTitle]="'or select All'"
               [imageUrl]="'../../../../assets/images/money/default-popup.svg'"
               [content]="content" [inputs]="inputs"
               [ok]="true"
               [exit]="true"
               [clear]="true"
               (okEvent)="onOK()"
               (clearEvent)="onClear()"
               (exitEvent)="onExit()">
    </jbr-popup>
</ng-template>
