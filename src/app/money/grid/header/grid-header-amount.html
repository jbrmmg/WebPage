<p (click)="openModal(templateAmountFilter)" (keydown.enter)="openModal(templateAmountFilter)">{{header}}</p>

<ng-template #templateAmountFilter>
    <jbr-popup [title]="'Select Amount Range'"
               [imageUrl]="'../../../../assets/images/money/default-popup.svg'"
               [content]="content" [inputs]="inputs"
               [ok]="true"
               [exit]="true"
               [clear]="true"
               (okEvent)="onOK()"
               (clearEvent)="onClear()"
               (exitEvent)="onExit()">
    </jbr-popup>
</ng-template>
