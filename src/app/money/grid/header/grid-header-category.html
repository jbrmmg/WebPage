<p (click)="openModal(templateCategoryFilter)">{{header}}</p>

<ng-template #templateCategoryFilter>
    <div class="modal-header">
        <h4 class="modal-title pull-left">Select Categories</h4>
    </div>
    <div class="body">
        <jbr-category style="width:100%"
            [filterMode]="true"
            [allowTransfer]="false"
            [selectedCategoryIds]="categoryIds"
            (cleared)="onClear()"
            (selected)="onSelect($event)"
            (exit)="onExit()">
        </jbr-category>
    </div>
</ng-template>
