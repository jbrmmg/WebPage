<p (click)="openModal(templateCategoryFilter)" (keydown.enter)="openModal(templateCategoryFilter)" tabindex="0">{{header}}</p>

<ng-template #templateCategoryFilter>
    <jbr-popup [title]="'Select Categories'"
               [subTitle]="'or select All'"
               [imageUrl]="'../../../../assets/images/money/default-popup.svg'"
               [content]="content" [inputs]="inputs"
               [ok]="true"
               [exit]="true"
               [clear]="true"
               (okEvent)="onOK()"
               (clearEvent)="onClear()"
               (exitEvent)="onExit()">
    </jbr-popup>
</ng-template>
