<div class="row row-no-margin">
    <div class="col-6 date-col-margin">
        <div class="col-12">
            <div>From Date</div>
            <input id="from-date"
                   type="text"
                   placeholder="Datepicker"
                   class="form-control filter-datepicker date-entry"
                   [bsValue]="fromValue"
                   (bsValueChange)="onDateChangeFrom($event)"
                   value="{{ fromValue | date:'dd-MMMM-yyyy'}}"
                   bsDatepicker [bsConfig]="{
                                                dateInputFormat: 'DD-MMMM-YYYY',
                                                containerClass: 'theme-dark-blue',
                                                selectFromOtherMonth: true }"/>
        </div>
    </div>
    <div class="col-6 date-col-margin">
        <div class="col-12">
            <div>To Date</div>
            <input id="to-date"
                   type="text"
                   placeholder="Datepicker"
                   class="form-control filter-datepicker date-entry"
                   [bsValue]="toValue"
                   (bsValueChange)="onDateChangeTo($event)"
                   value="{{ toValue | date:'dd-MMMM-yyyy'}}"
                   bsDatepicker [bsConfig]="{
                                                dateInputFormat: 'DD-MMMM-YYYY',
                                                containerClass: 'theme-dark-blue',
                                                selectFromOtherMonth: true }"/>
        </div>
    </div>
</div>
<div class="row row-no-margin">
    <div class="col-2 btn-no-margin">
        <div class="btn-action">
            <button class="btn-action btn btn-primary" (click)="yearToDate()">YTD</button>
        </div>
    </div>
    <div class="col-2 btn-no-margin">
        <div class="btn-action">
            <button class="btn-action btn btn-primary" (click)="last12Months()">Last 12 Months</button>
        </div>
    </div>
    <div class="col-2 btn-no-margin">
        <div class="btn-action">
            <button class="btn-action btn btn-primary" (click)="lastYear()">Last Year</button>
        </div>
    </div>
    <div class="col-2 btn-no-margin">
        <div class="btn-action">
            <button class="btn-action btn btn-primary" (click)="monthToDate()">MTD</button>
        </div>
    </div>
    <div class="col-2 btn-no-margin">
        <div class="btn-action">
            <button class="btn-action btn btn-primary" (click)="lastMonth()">Last Month</button>
        </div>
    </div>
    <div class="col-2 btn-no-margin">
        <div class="btn-action">
            <button class="btn-action btn btn-primary" (click)="previousMonth()">Previous Month</button>
        </div>
    </div>
</div>
