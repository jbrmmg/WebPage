<div class="row row-no-margin">
    <div class="col-6 amount-col-margin">
        <div class="col-12">
            <div>From Amount</div>
            <input id="from-amount"
                   [(ngModel)]="fromAmount.display"
                   (input)="change($event,fromAmount)"
                   type="text"
                   class="amount-entry"/>
        </div>
    </div>
    <div class="col-6 amount-col-margin">
        <div class="col-12">
            <div>To Amount</div>
            <input id="to-amount"
                   [(ngModel)]="toAmount.display"
                   (input)="change($event,toAmount)"
                   type="text"
                   class="amount-entry"/>
        </div>
    </div>
</div>
