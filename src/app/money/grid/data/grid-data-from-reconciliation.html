<p class="fa fa-check" *ngIf="transaction.fromReconciliation" (click)="selectFile(templateSelectFile)"></p>
<p class="" *ngIf="!transaction.fromReconciliation" (click)="selectFile(templateSelectFile)">&nbsp;</p>

<ng-template #templateSelectFile>
    <div class="modal-header">
        <h4 class="modal-title pull-left">Select a File to load</h4>
    </div>
    <div class="body">
        <jbr-money-files (exitEmitter)="onExit()">
        </jbr-money-files>
    </div>
</ng-template>
