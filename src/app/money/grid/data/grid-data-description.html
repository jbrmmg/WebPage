<p *ngIf="!isEditing() && !blank()" (click)="onClick()" (keydown.enter)="onClick()" tabindex="0" [style.background]="'#' + getCategoryColour()" [style.color]="'#' + getTextColour()">{{getDescription()}}</p>
<p *ngIf="!isEditing() && blank()" (click)="onClick()" (keydown.enter)="onClick()" tabindex="0" style="height: 100%">&nbsp;</p>
<input *ngIf="isEditing()" (keydown)="onKeydown($event)" style="width:100%" #input type="text"/>
