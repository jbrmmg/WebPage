<p (click)="openModal(templateStatement)">{{display() | date : 'yyyy-MMM'}}</p>

<ng-template #templateStatement>
    <div class="modal-header">
        <h4 class="modal-title pull-left">
            <div class="row">
                <div class="col">
                    <img src="{{_moneyService.getAccountImage(transaction.account.id)}}" alt="Selected Account">
                </div>
                <div class="col">
                    <div class="row statement">Statement</div>
                    <div class="row date">{{getDate() | date : 'MMMM yyyy'}}</div>
                </div>
            </div>
        </h4>
    </div>
    <div class="body">
        <jbr-statement [account]="transaction.account" [statement]="transaction.statement" (lockEmitter)="lock()" (exitEmitter)="close()">
        </jbr-statement>
    </div>
</ng-template>
